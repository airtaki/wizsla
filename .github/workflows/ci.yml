name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run --prefix web typecheck
      - run: npm test
      - run: npm run --prefix web test
      - run: npm run test:e2e
      - run: npm run build
      - name: The web app's API types match the API
        run: |
          npm run openapi
          npm run --prefix web api
          git diff --exit-code web/openapi.json web/src/api/schema.d.ts
      - run: npm run --prefix web build
