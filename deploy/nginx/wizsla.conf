# Wizsla over HTTPS, for the home network only.
#
# Copy to /etc/nginx/sites-available/wizsla and link it into sites-enabled.
# wizsla.ilh.hu points to the Pi's Wi-Fi address (public DNS and Pi-hole).
#
# It answers on that address only. Port forwards from the internet arrive at
# the wired address (192.168.8.89), so they never reach this server; the
# allow list is a second line of defence. While another server listens on
# all addresses (`listen 443`), nginx binds only that one socket and picks
# this server by the destination address, so it starts even before the
# Wi-Fi is up.
#
# The port is Wizsla's PORT from /opt/wizsla/.env.

server {
    listen 192.168.11.209:443 ssl;
    server_name wizsla.ilh.hu;

    ssl_certificate /etc/letsencrypt/live/wizsla.ilh.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wizsla.ilh.hu/privkey.pem;

    allow 192.168.8.0/22; # the home network, wired and Wi-Fi
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
